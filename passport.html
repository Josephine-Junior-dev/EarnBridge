<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a22"><meta name="description" content="Public EarnBridge Work Passport"><title>Work Passport | EarnBridge</title><link rel="stylesheet" href="./styles.css"></head>
<body><header class="top"><a class="brand" href="./"><span class="brand-mark">e<span>+</span></span><span class="brand-name">earnbridge<small>VERIFIED WORK PASSPORT</small></span></a><span class="secure-label">● Public professional profile</span></header>
<main style="max-width:980px;margin:38px auto;padding:16px"><div id="passport-state" class="loading">Loading Work Passport…</div><div id="passport-content" class="hidden"></div></main>
<footer>EarnBridge · A public record of customer-confirmed work. Always verify qualifications and references independently.</footer>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm";
import { APP_CONFIG } from "./config.js";
const db=createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseAnonKey);
const id=new URLSearchParams(location.search).get("id");
const state=document.querySelector("#passport-state"),root=document.querySelector("#passport-content");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(!id){state.textContent="This Work Passport link is incomplete.";throw new Error("Missing profile id");}
const {data,error}=await db.rpc("eb_get_public_passport",{p_user_id:id});
if(error||data?.error){state.textContent=data?.error||error.message;throw error||new Error(data.error);}
const p=data.profile,w=data.verified_work||[],skills=data.skills||[];
root.innerHTML='<section class="profile-preview public-passport"><div class="avatar">'+esc((p.full_name||"E").slice(0,1).toUpperCase())+'</div><span class="tag tag-green">EarnBridge Work Passport</span><h1>'+esc(p.full_name||"Independent professional")+'</h1><p>'+esc(p.headline||"Independent professional")+'</p><p>'+esc([p.city,p.country].filter(Boolean).join(", "))+'</p><p>'+esc(p.bio||"")+'</p><div class="profile-count"><b>'+w.length+'</b> customer-confirmed work records · <b>'+skills.length+'</b> listed skills</div>'+(p.website_url&&/^https?:\/\//i.test(p.website_url)?'<p><a style="color:white" href="'+esc(p.website_url)+'" rel="noopener" target="_blank">Professional website ↗</a></p>':"")+'</section><section class="report-panel" style="margin-top:18px"><h2>Skills & experience</h2><div class="skill-grid">'+(skills.map(s=>'<article class="skill-card"><h3>'+esc(s.skill_name)+'</h3><span class="tag tag-green">'+esc(s.skill_level)+'</span><p>'+Number(s.years_experience||0)+' years experience (self-reported)</p></article>').join("")||'<p>No skills listed yet.</p>')+'</div></section><section class="report-panel" style="margin-top:18px"><h2>Customer-confirmed work</h2><div class="list-cards">'+(w.map(x=>'<article class="list-card"><div><span class="tag tag-green">✓ Customer confirmed</span><h3>'+esc(x.project_title)+'</h3><p>'+esc(x.work_description)+'</p><small>Completed: '+esc(x.completion_date||"Date not supplied")+' · Confirmed: '+new Date(x.verified_at).toLocaleDateString()+'</small>'+(x.customer_rating?'<p>Customer rating: '+x.customer_rating+'/5</p>':"")+'</div></article>').join("")||'<p>No customer-confirmed work is available to display yet.</p>')+'</div></section>';
state.classList.add("hidden");root.classList.remove("hidden");
</script></body></html>
